<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>대시보드 — CloudPress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="dashboard.css"/>
</head>
<body>
<div class="app-wrap">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <a href="/dashboard.html" class="sb-logo">
      <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
        <path d="M14 2L26 8V20L14 26L2 20V8L14 2Z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M14 8L20 11V17L14 20L8 17V11L14 8Z" fill="currentColor" opacity="0.5"/>
        <circle cx="14" cy="14" r="2.2" fill="currentColor"/>
      </svg>
      CloudPress
    </a>
    <nav class="sb-nav">
      <div class="sb-section">
        <div class="sb-label">메인</div>
        <a href="/dashboard.html" class="sb-link active">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/></svg>
          대시보드
        </a>
        <a href="/create.html" class="sb-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          사이트 추가
        </a>
      </div>
      <div class="sb-section">
        <div class="sb-label">계정</div>
        <a href="/account.html" class="sb-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          내 계정
        </a>
        <a href="/pricing.html" class="sb-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M2 10h20" stroke="currentColor" stroke-width="1.5"/></svg>
          요금제 변경
        </a>
      </div>
      <div class="sb-section">
        <div class="sb-label">지원</div>
        <a href="#" class="sb-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="17" r=".5" fill="currentColor" stroke="currentColor"/></svg>
          도움말
        </a>
        <button class="sb-link danger" onclick="CP.logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><polyline points="16 17 21 12 16 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          로그아웃
        </button>
      </div>
    </nav>
    <div class="sb-user">
      <div class="sb-avatar" id="sbAvatar">?</div>
      <div class="sb-uinfo">
        <div class="sb-uname" id="sbName">—</div>
        <div class="sb-uemail" id="sbEmail">—</div>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:14px">
        <button class="sidebar-toggle" onclick="openSidebar()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <span class="topbar-title">대시보드</span>
      </div>
      <div class="topbar-actions">
        <a href="/create.html" class="btn btn-primary btn-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          새 사이트
        </a>
      </div>
    </div>

    <div class="content">
      <!-- WELCOME -->
      <div style="margin-bottom:28px">
        <h1 style="font-family:var(--font-head);font-size:1.4rem;font-weight:700;margin-bottom:4px" id="welcomeMsg">안녕하세요!</h1>
        <p style="color:var(--muted);font-size:.88rem">WordPress 사이트 현황을 확인하세요.</p>
      </div>

      <!-- STATS -->
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
          <div class="sc-icon" style="background:rgba(249,115,22,.1)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="20" height="14" rx="2" stroke="#f97316" stroke-width="1.5"/><path d="M8 21h8M12 17v4" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
          <div class="sc-val" id="statSites">0</div>
          <div class="sc-lbl">WordPress 사이트</div>
        </div>
        <div class="stat-card">
          <div class="sc-icon" style="background:rgba(34,197,94,.1)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="#22c55e" stroke-width="1.5"/></svg>
          </div>
          <div class="sc-val" id="statActive">0</div>
          <div class="sc-lbl">활성 사이트</div>
        </div>
        <div class="stat-card">
          <div class="sc-icon" style="background:rgba(99,102,241,.1)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="11" rx="1" stroke="#6366f1" stroke-width="1.5"/><rect x="13" y="9" width="8" height="5" rx="1" stroke="#6366f1" stroke-width="1.5"/><rect x="3" y="17" width="18" height="4" rx="1" stroke="#6366f1" stroke-width="1.5"/></svg>
          </div>
          <div class="sc-val" id="statStorage">0 GB</div>
          <div class="sc-lbl">스토리지 사용</div>
        </div>
        <div class="stat-card">
          <div class="sc-icon" style="background:rgba(236,72,153,.1)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#ec4899" stroke-width="1.5"/><path d="M12 6v6l4 2" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
          <div class="sc-val" id="statPlan">무료</div>
          <div class="sc-lbl">현재 플랜</div>
        </div>
      </div>

      <!-- SITES -->
      <div class="sites-header">
        <h2>내 WordPress 사이트</h2>
        <a href="/create.html" class="btn btn-ghost btn-sm">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          사이트 추가
        </a>
      </div>

      <div id="sitesContainer">
        <!-- Filled by JS -->
      </div>
    </div>
  </main>
</div>

<script src="app.js"></script>
<script>
  if (!CP.requireAuth()) throw 0;

  const user = CP.getCurrentUser();

  // Sidebar user info
  document.getElementById('sbAvatar').textContent = user.name.charAt(0).toUpperCase();
  document.getElementById('sbName').textContent = user.name;
  document.getElementById('sbEmail').textContent = user.email;
  document.getElementById('welcomeMsg').textContent = `안녕하세요, ${user.name}님! 👋`;

  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('show');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  }

  function renderDashboard() {
    const sites = CP.getSites(user.id);
    const activeSites = sites.filter(s => s.status === 'active');
    const totalStorage = sites.reduce((a, s) => a + (s.storageUsed || 0), 0).toFixed(1);
    const planInfo = CP.planInfo(user.plan);

    document.getElementById('statSites').textContent = sites.length;
    document.getElementById('statActive').textContent = activeSites.length;
    document.getElementById('statStorage').textContent = totalStorage + ' GB';
    document.getElementById('statPlan').textContent = planInfo.name;

    const container = document.getElementById('sitesContainer');

    if (sites.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
          <h3>아직 사이트가 없습니다</h3>
          <p>첫 번째 WordPress 사이트를 5분 안에 개설해보세요.</p>
          <a href="/create.html" class="btn btn-primary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            WordPress 사이트 개설
          </a>
        </div>`;
      return;
    }

    container.innerHTML = `<div class="sites-grid">${sites.map(site => siteCard(site)).join('')}</div>`;
  }

  function siteCard(site) {
    const statusMap = {
      active: { cls: 'active', label: '운영 중' },
      provisioning: { cls: 'provisioning', label: '설치 중...' },
      inactive: { cls: 'inactive', label: '비활성' },
      error: { cls: 'error', label: '오류' }
    };
    const st = statusMap[site.status] || statusMap.inactive;
    const date = CP.formatDate(site.createdAt);
    return `
      <div class="site-card">
        <div class="site-status">
          <div class="status-dot ${st.cls}"></div>
          <span class="status-text ${st.cls}">${st.label}</span>
        </div>
        <div class="site-name">${escHtml(site.name)}</div>
        <div class="site-domain">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" style="display:inline;vertical-align:middle;opacity:.5"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/><path d="M2 12h20M12 2c-3 3-4 6-4 10s1 7 4 10M12 2c3 3 4 6 4 10s-1 7-4 10" stroke="currentColor" stroke-width="1.5"/></svg>
          ${escHtml(site.domain)}
        </div>
        <div class="site-meta">
          <div class="site-meta-item"><span class="smi-val">WP ${site.wpVersion || '6.5'}</span><span class="smi-lbl">WordPress</span></div>
          <div class="site-meta-item"><span class="smi-val">PHP ${site.php || '8.3'}</span><span class="smi-lbl">PHP 버전</span></div>
          <div class="site-meta-item"><span class="smi-val">${site.storageUsed || 0} GB</span><span class="smi-lbl">스토리지</span></div>
        </div>
        <div class="site-actions">
          <a href="/site.html?id=${site.id}" class="btn btn-ghost">관리</a>
          ${site.status === 'active' ? `<a href="https://${site.domain}/wp-admin" target="_blank" class="btn btn-primary">WP 관리자</a>` : `<span class="btn btn-ghost" style="opacity:.4;cursor:default">설치 중</span>`}
        </div>
      </div>`;
  }

  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  renderDashboard();

  // Re-render if provisioning sites finish
  setInterval(() => {
    const sites = CP.getSites(user.id);
    const provisioning = sites.filter(s => s.status === 'provisioning');
    if (provisioning.length) {
      const now = Date.now();
      let changed = false;
      provisioning.forEach(s => {
        if (now - s.createdAt > 8000) {
          CP.updateSite(s.id, { status: 'active' });
          changed = true;
        }
      });
      if (changed) renderDashboard();
    }
  }, 2000);
</script>
</body>
</html>
